import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'com.vanniktech.maven.publish'
    id 'application'
}

group = 'tech.kwik'

// Derive the project version from git at configuration time, so that every task
// (the jar, and the sources/javadoc jars and publications created by the
// vanniktech plugin) consistently sees the same version. A clean tag like
// 'v1.0.19' becomes '1.0.19'; any other 'git describe' output (development
// builds) is used verbatim.
version = {
    def proc = "git describe --always --dirty".execute()
    proc.waitFor()
    if (proc.exitValue() != 0) {
        logger.quiet("Building development version.")
        return 'unspecified'
    }
    def versionTag = proc.in.readLines()[0]
    if (versionTag ==~ /v?[0-9]+(\.\d+){1,2}/) {
        if (versionTag.startsWith("v")) {
            versionTag = versionTag[1..-1]
        }
        logger.quiet("Building version ${versionTag}.")
    } else {
        logger.error("Version tag '${versionTag}' does not contain a valid version.")
    }
    return versionTag
}()

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('html5', true)
}

repositories {
    mavenCentral()
}

ext.agent15_version = '3.3'
ext.mockito_version = '5.23.0'

// Resolvable configuration holding just the mockito-core jar, so it can be passed to the test JVM as a Java agent
// (see the '-javaagent' argument on the 'test' task). As of JDK 21+ dynamically self-attaching agents is deprecated
// and will be disallowed by default in a future JDK; loading Mockito's agent explicitly avoids that.
configurations {
    mockitoAgent
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.14.4')
    testImplementation("org.mockito:mockito-core:${mockito_version}")
    testImplementation("org.assertj:assertj-core:3.27.7")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    mockitoAgent("org.mockito:mockito-core:${mockito_version}") { transitive = false }
}

sourceSets {
    main {
        resources {
            srcDir "${buildDir}/generated"
            exclude 'sources/**'
        }
    }
}

tasks.named('test') {
    jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
            }
        }
    }
}

compileJava.dependsOn processResources

mavenPublishing {
    // Publish the java component with a sources jar and an (intentionally) empty
    // javadoc jar. Maven Central requires a javadoc jar to be present, but we do
    // not ship the generated documentation; it can be generated from source with
    // './gradlew javadoc'.
    configure(new JavaLibrary(new JavadocJar.Empty(), true))

    // Uploads to Maven Central (Central Portal). Credentials are read from the
    // 'mavenCentralUsername' / 'mavenCentralPassword' Gradle properties.
    publishToMavenCentral()

    // GPG-signs all publications, using the standard signing.* Gradle properties.
    signAllPublications()

    // The artifactId defaults to the (sub)project name, the group and version to
    // the project's group and version. Modules override name/description below.
    pom {
        name = 'Kwik'
        description = 'A QUIC implementation in Java'
        url = 'https://github.com/ptrd/kwik'

        licenses {
            license {
                name = 'GNU Lesser General Public License v3'
                url = 'https://www.gnu.org/licenses/lgpl-3.0-standalone.html'
            }
        }

        developers {
            developer {
                id = 'peterd'
                name = 'Peter Doornbosch'
                email = 'peter.doornbosch@gmail.com'
            }
        }

        scm {
            connection = 'scm:git:git@github.com:ptrd/kwik.git'
            developerConnection = 'scm:git:git@github.com:ptrd/kwik.git'
            url = 'https://github.com/ptrd/kwik'
        }
    }
}
